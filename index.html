      </div>
      <div class="fin-sec">Itens da compra</div>
      <div class="venda-card">${itensHTML||'<div class="venda-card-item" style="color:var(--text-muted)">Sem itens.</div>'}</div>
    </div>
  </div>`;
}

// ===== PAINEL FINANCEIRO =====
function renderFinanceiro(){
  const hoje=new Date(),mes=hoje.toISOString().slice(0,7);
  return`<div style="display:flex;flex-direction:column;flex:1">
    <div class="mod-header"><div class="mod-title">Painel Financeiro</div></div>
    <div class="fin-body">
      <div class="fin-filtros">
        <div class="fin-filtros-title">Período</div>
        <div class="fin-tabs">
          <button class="fin-tab on" id="ftab-mes" onclick="setFinTab('mes')">Por mês</button>
          <button class="fin-tab" id="ftab-periodo" onclick="setFinTab('periodo')">Período livre</button>
        </div>
        <div id="fin-filtro-mes">
          <div class="fin-row">
            <div class="fg"><label class="fl">Mês / Ano</label><input class="fi" type="month" id="fin-mes" value="${mes}"></div>
            <button class="btn-filtrar" onclick="calcFinanceiro()">Calcular</button>
          </div>
        </div>
        <div id="fin-filtro-periodo" style="display:none">
          <div class="fin-row">
            <div class="fg"><label class="fl">Data início</label><input class="fi" type="date" id="fin-dt-ini" value="${hoje.getFullYear()}-01-01"></div>
            <div class="fg"><label class="fl">Data fim</label><input class="fi" type="date" id="fin-dt-fim" value="${hoje.toISOString().split('T')[0]}"></div>
            <button class="btn-filtrar" onclick="calcFinanceiro()">Calcular</button>
          </div>
        </div>
      </div>
      <div id="fin-resultado"></div>
    </div>
  </div>`;
}
function setFinTab(tab){
  document.getElementById('ftab-mes').classList.toggle('on',tab==='mes');
  document.getElementById('ftab-periodo').classList.toggle('on',tab==='periodo');
  document.getElementById('fin-filtro-mes').style.display=tab==='mes'?'block':'none';
  document.getElementById('fin-filtro-periodo').style.display=tab==='periodo'?'block':'none';
}
function calcFinanceiro(){
  const tabMes=document.getElementById('ftab-mes').classList.contains('on');
  let dtIni,dtFim;
  if(tabMes){
    const mes=document.getElementById('fin-mes').value;
    if(!mes){toast('Selecione o mês','e');return;}
    dtIni=mes+'-01';
    const[y,m]=mes.split('-').map(Number);
    dtFim=mes+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  }else{
    dtIni=document.getElementById('fin-dt-ini').value;
    dtFim=document.getElementById('fin-dt-fim').value;
    if(!dtIni||!dtFim){toast('Informe as datas','e');return;}
  }
  const vendas=DB.Vendas||[],vi=DB.VendasItens||[],compras=DB.Compras||[],ci=DB.ComprasItens||[];
  const clientes=DB.Cliente||[],fornecs=DB.Fornecedor||[];
  const vPeriodo=vendas.filter(v=>{const d=v.DataVenda||'';return d>=dtIni&&d<=dtFim;});
  const cPeriodo=compras.filter(c=>{const d=c.DataEntrada||'';return d>=dtIni&&d<=dtFim;});
  const totalEnt=vPeriodo.filter(v=>v.StatusPagamento==='Pago').reduce((s,v)=>{
    return s+vi.filter(i=>String(i.CodVenda)===String(v.Cod)).reduce((ss,i)=>ss+Number(i.ValorTotal||0),0);},0);
  const totalPendRec=vPeriodo.filter(v=>v.StatusPagamento!=='Pago').reduce((s,v)=>{
    return s+vi.filter(i=>String(i.CodVenda)===String(v.Cod)).reduce((ss,i)=>ss+Number(i.ValorTotal||0),0);},0);
  const totalSai=cPeriodo.filter(c=>c.StatusPagamento==='Pago').reduce((s,c)=>{
    return s+ci.filter(i=>String(i.CodCompra)===String(c.Cod)).reduce((ss,i)=>ss+Number(i.ValorTotal||0),0);},0);
  const totalPendPag=cPeriodo.filter(c=>c.StatusPagamento!=='Pago').reduce((s,c)=>{
    return s+ci.filter(i=>String(i.CodCompra)===String(c.Cod)).reduce((ss,i)=>ss+Number(i.ValorTotal||0),0);},0);
  const saldo=totalEnt-totalSai;
  const periodoLabel=tabMes?document.getElementById('fin-mes').value.split('-').reverse().join('/'):fmtD(dtIni)+' → '+fmtD(dtFim);
  const detV=vPeriodo.map(v=>{
    const cli=clientes.find(x=>String(x.Cod)===String(v.CodCliente));
    const it=vi.filter(i=>String(i.CodVenda)===String(v.Cod));
    const tot=it.reduce((s,i)=>s+Number(i.ValorTotal||0),0);
    return`<div class="fin-item"><div class="fin-item-left">
      <div class="fin-item-nome">${esc(cli?cli.Nome:'Cliente '+v.CodCliente)}</div>
      <div class="fin-item-sub">Venda #${v.Cod} · ${fmtD(v.DataVenda)} · ${it.length} item(ns) ·
        <span class="badge ${v.StatusPagamento==='Pago'?'pago':'pendente'}" style="font-size:11px">${v.StatusPagamento||'Pendente'}</span></div>
    </div><span class="fin-item-valor e">${fmt$(tot)}</span></div>`;
  }).join('')||'<p style="font-size:13px;color:var(--text-muted)">Nenhuma venda.</p>';
  const detC=cPeriodo.map(c=>{
    const f=fornecs.find(x=>String(x.Cod)===String(c.Fornecedor));
    const it=ci.filter(i=>String(i.CodCompra)===String(c.Cod));
    const tot=it.reduce((s,i)=>s+Number(i.ValorTotal||0),0);
    return`<div class="fin-item"><div class="fin-item-left">
      <div class="fin-item-nome">${esc(f?f.Fornecedor:'Fornecedor '+c.Fornecedor)}</div>
      <div class="fin-item-sub">NF ${esc(c.NF||'—')} · ${fmtD(c.DataEntrada)} ·
        <span class="badge ${c.StatusPagamento==='Pago'?'pago':'pendente'}" style="font-size:11px">${c.StatusPagamento||'Pendente'}</span></div>
    </div><span class="fin-item-valor s">${fmt$(tot)}</span></div>`;
  }).join('')||'<p style="font-size:13px;color:var(--text-muted)">Nenhuma compra.</p>';
  document.getElementById('fin-resultado').innerHTML=`
    <div class="fin-resumo">
      <div class="fin-card entrada"><div class="fin-card-label">Entradas (recebidas)</div><div class="fin-card-value">${fmt$(totalEnt)}</div></div>
      <div class="fin-card saida"><div class="fin-card-label">Saídas (pagas)</div><div class="fin-card-value">${fmt$(totalSai)}</div></div>
      <div class="fin-card ${saldo>=0?'saldo-pos':'saldo-neg'}"><div class="fin-card-label">Saldo</div><div class="fin-card-value">${fmt$(saldo)}</div></div>
    </div>
    ${(totalPendRec>0||totalPendPag>0)?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      ${totalPendRec>0?`<div style="background:var(--bg-warning);border:1px solid var(--border-warning);border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:var(--text-warning);font-weight:500;text-transform:uppercase">A receber</div>
        <div style="font-size:18px;font-weight:700;color:var(--text-warning)">${fmt$(totalPendRec)}</div></div>`:''}
      ${totalPendPag>0?`<div style="background:var(--bg-danger);border:1px solid var(--border-danger);border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:var(--text-danger);font-weight:500;text-transform:uppercase">A pagar</div>
        <div style="font-size:18px;font-weight:700;color:var(--text-danger)">${fmt$(totalPendPag)}</div></div>`:''}
    </div>`:''}
    <div class="fin-sec">Vendas — ${periodoLabel}</div>${detV}
    <div class="fin-sec">Compras — ${periodoLabel}</div>${detC}`;
}

if(URL_API){loadAll().then(ok=>{if(ok)render();else render();});}
else{render();}
</script>
